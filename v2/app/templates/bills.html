<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bills - AyeSpy v2</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <h1>Bills</h1>
    <ul>
      {% for bill in bills %}
      <li><a href="/bills/{{ bill.id }}">{{ bill.title }}</a></li>
      {% else %}
      <li>No bills yet</li>
      {% endfor %}
    </ul>
  </body>
</html>
