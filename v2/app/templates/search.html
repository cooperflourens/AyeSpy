<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search - AyeSpy v2</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <h1>Search Quotes</h1>
    <form hx-get="/search/partial" hx-target="#results" hx-trigger="submit">
      <input type="text" name="q" placeholder="Topic or keyword" />
      <button type="submit">Search</button>
    </form>
    <div id="results">
      {% include "partials/search_results.html" %}
    </div>
  </body>
</html>
